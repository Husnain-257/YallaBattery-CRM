<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Car Database | Yalla Battery</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef1f4;
    color:#123b40;
}

/* HEADER */
.header{
    background:#00525b;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header span{
    color:#ffb800;
    font-weight:bold;
}

/* CONTAINER */
.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 18px;
}

/* TOP */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.top h2{
    margin:0;
    color:#00525b;
}

/* CARD */
.card{
    background:white;
    border-radius:14px;
    padding:22px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
    margin-bottom:25px;
}

/* FORM */
.form-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.field input{
    width:100%;
    padding:12px;
    border:1px solid #d7dfe2;
    border-radius:8px;
    font-size:14px;
    outline:none;
}

.field input:focus{
    border-color:#00525b;
}

/* BUTTON */
button{
    border:none;
    border-radius:8px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:bold;
}

.save-btn{
    background:#ffb800;
    color:#123b40;
    margin-top:18px;
}

.cancel-btn{
    background:#e5eaec;
    color:#123b40;
    margin-top:18px;
    margin-left:8px;
    display:none;
}

/* TABLE */
.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#00525b;
    color:white;
    padding:13px;
    text-align:left;
    font-size:13px;
}

td{
    padding:13px;
    border-bottom:1px solid #e5eaec;
    font-size:14px;
}

tr:hover{
    background:#f8fafb;
}

.action-btn{
    padding:7px 12px;
    font-size:12px;
    margin-right:5px;
}

.edit{
    background:#00525b;
    color:white;
}

.delete{
    background:#d9534f;
    color:white;
}

/* EMPTY */
.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

/* MOBILE */
@media(max-width:800px){
    .form-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .header{
        padding:15px;
    }

    .header h1{
        font-size:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .top{
        align-items:flex-start;
        flex-direction:column;
        gap:8px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Yalla Battery <span>CRM</span></h1>
    <div>Car Database</div>
</div>

<div class="container">

    <div class="top">
        <h2>🚗 Car Database</h2>
    </div>

    <!-- ADD CAR -->
    <div class="card">

        <h3 id="formTitle">Add Car</h3>

        <div class="form-grid">

            <div class="field">
                <label>Car Brand / Make</label>
                <input type="text" id="make" placeholder="e.g. Toyota">
            </div>

            <div class="field">
                <label>Model</label>
                <input type="text" id="model" placeholder="e.g. Camry">
            </div>

            <div class="field">
                <label>Year</label>
                <input type="text" id="year" placeholder="e.g. 2024">
            </div>

            <div class="field">
                <label>Engine / Variant</label>
                <input type="text" id="engine" placeholder="e.g. 2.5L / Hybrid">
            </div>

        </div>

        <button class="save-btn" onclick="saveCar()" id="saveButton">
            + Add Car
        </button>

        <button class="cancel-btn" onclick="cancelEdit()" id="cancelButton">
            Cancel
        </button>

    </div>

    <!-- CAR LIST -->
    <div class="card">

        <h3>Saved Cars</h3>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Make</th>
                        <th>Model</th>
                        <th>Year</th>
                        <th>Engine / Variant</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="carTable"></tbody>

            </table>

        </div>

        <div class="empty" id="emptyMessage">
            No cars added yet.
        </div>

    </div>

</div>

<script>

let cars = JSON.parse(localStorage.getItem("yallaCars")) || [];

let editIndex = -1;


/* =========================
   SAVE CAR
========================= */

function saveCar(){

    const make = document.getElementById("make").value.trim();
    const model = document.getElementById("model").value.trim();
    const year = document.getElementById("year").value.trim();
    const engine = document.getElementById("engine").value.trim();

    if(!make || !model){

        alert("Please enter Car Brand and Model.");

        return;
    }

    const car = {
        make: make,
        model: model,
        year: year,
        engine: engine
    };


    /* EDIT */
    if(editIndex !== -1){

        cars[editIndex] = car;

        editIndex = -1;

        document.getElementById("saveButton").innerText = "+ Add Car";
        document.getElementById("cancelButton").style.display = "none";
        document.getElementById("formTitle").innerText = "Add Car";

    }

    /* ADD */
    else{

        cars.push(car);

    }


    localStorage.setItem("yallaCars", JSON.stringify(cars));

    clearForm();

    displayCars();

}


/* =========================
   DISPLAY CARS
========================= */

function displayCars(){

    const table = document.getElementById("carTable");
    const empty = document.getElementById("emptyMessage");

    table.innerHTML = "";

    if(cars.length === 0){

        empty.style.display = "block";

        return;

    }

    empty.style.display = "none";


    cars.forEach((car,index)=>{

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${escapeHTML(car.make)}</td>
            <td>${escapeHTML(car.model)}</td>
            <td>${escapeHTML(car.year)}</td>
            <td>${escapeHTML(car.engine)}</td>

            <td>
                <button class="action-btn edit"
                    onclick="editCar(${index})">
                    Edit
                </button>

                <button class="action-btn delete"
                    onclick="deleteCar(${index})">
                    Delete
                </button>
            </td>
        `;

        table.appendChild(row);

    });

}


/* =========================
   EDIT
========================= */

function editCar(index){

    const car = cars[index];

    document.getElementById("make").value = car.make;
    document.getElementById("model").value = car.model;
    document.getElementById("year").value = car.year;
    document.getElementById("engine").value = car.engine;

    editIndex = index;

    document.getElementById("formTitle").innerText = "Edit Car";
    document.getElementById("saveButton").innerText = "Update Car";
    document.getElementById("cancelButton").style.display = "inline-block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   DELETE
========================= */

function deleteCar(index){

    if(!confirm("Are you sure you want to delete this car?")){

        return;

    }

    cars.splice(index,1);

    localStorage.setItem("yallaCars", JSON.stringify(cars));

    displayCars();

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

    editIndex = -1;

    clearForm();

    document.getElementById("formTitle").innerText = "Add Car";
    document.getElementById("saveButton").innerText = "+ Add Car";
    document.getElementById("cancelButton").style.display = "none";

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

    document.getElementById("make").value = "";
    document.getElementById("model").value = "";
    document.getElementById("year").value = "";
    document.getElementById("engine").value = "";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   LOAD
========================= */

displayCars();

</script>

</body>
</html>
