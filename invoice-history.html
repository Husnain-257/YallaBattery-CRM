<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invoice History | Yalla Battery</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f7;
    color:#17202a;
}

/* HEADER */

.header{
    background:#00525b;
    color:white;
    padding:22px 20px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:30px;
    font-weight:800;
}

.header p{
    margin:6px 0 0;
    font-size:14px;
    color:#d8f3f5;
}

/* CONTAINER */

.container{
    width:95%;
    max-width:1200px;
    margin:25px auto;
}

/* TOP BAR */

.topbar{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
}

.searchBox{
    flex:1;
    min-width:240px;
}

.searchBox input{
    width:100%;
    padding:13px 15px;
    border:1px solid #d7dfe2;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

.searchBox input:focus{
    border-color:#00525b;
}

/* BUTTONS */

.btn{
    border:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

.btn-back{
    background:#00525b;
    color:white;
}

.btn-back:hover{
    background:#003f46;
}

/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:20px;
}

.summaryBox{
    background:white;
    border-radius:12px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.summaryBox .title{
    font-size:13px;
    color:#667;
    margin-bottom:8px;
}

.summaryBox .value{
    font-size:24px;
    font-weight:800;
    color:#00525b;
}

/* TABLE */

.tableBox{
    margin-top:20px;
    background:white;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    overflow:hidden;
}

.tableTitle{
    padding:18px 20px;
    background:#00525b;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.tableWrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th{
    background:#f0f4f5;
    color:#17202a;
    padding:13px 10px;
    text-align:left;
    font-size:13px;
    border-bottom:1px solid #ddd;
}

td{
    padding:13px 10px;
    border-bottom:1px solid #eee;
    font-size:13px;
}

tr:hover{
    background:#fafcfc;
}

/* STATUS */

.payment{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#e7f6f3;
    color:#00695c;
    font-size:11px;
    font-weight:bold;
}

/* ACTION BUTTONS */

.actionBtn{
    border:none;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
    margin:2px;
}

.viewBtn{
    background:#00525b;
    color:white;
}

.printBtn{
    background:#ffb800;
    color:#17202a;
}

.deleteBtn{
    background:#e74c3c;
    color:white;
}

.actionBtn:hover{
    opacity:.85;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

.emptyIcon{
    font-size:45px;
    margin-bottom:10px;
}

.empty h3{
    margin:5px 0;
    color:#444;
}

/* MOBILE */

@media(max-width:800px){

    .summary{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .header h1{
        font-size:24px;
    }

    .container{
        width:94%;
    }

    .summary{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .summaryBox{
        padding:14px;
    }

    .summaryBox .value{
        font-size:19px;
    }

    .topbar{
        padding:14px;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<div class="header">

    <h1>YALLA BATTERY</h1>

    <p>Invoice History & Management</p>

</div>


<div class="container">


    <!-- TOP BAR -->

    <div class="topbar">

        <div class="searchBox">

            <input
                type="text"
                id="searchInput"
                placeholder="Search invoice no, customer, phone or vehicle..."
                oninput="loadInvoices()"
            >

        </div>

        <button
            class="btn btn-back"
            onclick="goBack()"
        >
            ← BACK TO CRM
        </button>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summaryBox">

            <div class="title">
                TOTAL INVOICES
            </div>

            <div
                class="value"
                id="totalInvoices"
            >
                0
            </div>

        </div>


        <div class="summaryBox">

            <div class="title">
                TOTAL SALES
            </div>

            <div
                class="value"
                id="totalSales"
            >
                AED 0.00
            </div>

        </div>


        <div class="summaryBox">

            <div class="title">
                TOTAL VAT
            </div>

            <div
                class="value"
                id="totalVat"
            >
                AED 0.00
            </div>

        </div>


        <div class="summaryBox">

            <div class="title">
                AVERAGE INVOICE
            </div>

            <div
                class="value"
                id="averageInvoice"
            >
                AED 0.00
            </div>

        </div>

    </div>


    <!-- TABLE -->

    <div class="tableBox">

        <div class="tableTitle">

            Invoice History

        </div>


        <div class="tableWrapper">

            <table>

                <thead>

                    <tr>

                        <th>Invoice No</th>

                        <th>Date</th>

                        <th>Customer</th>

                        <th>Phone</th>

                        <th>Vehicle</th>

                        <th>Payment</th>

                        <th>VAT</th>

                        <th>Total</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="invoiceTableBody">

                </tbody>

            </table>

        </div>


        <div
            id="emptyMessage"
            class="empty"
            style="display:none;"
        >

            <div class="emptyIcon">
                🧾
            </div>

            <h3>
                No invoices found
            </h3>

            <p>
                Your created invoices will appear here.
            </p>

        </div>

    </div>

</div>



<script>

/* =========================================
   GET INVOICES FROM LOCAL STORAGE
========================================= */

function getInvoices(){

    try{

        const data = localStorage.getItem("yallaInvoices");

        if(!data){
            return [];
        }

        const invoices = JSON.parse(data);

        return Array.isArray(invoices) ? invoices : [];

    }catch(error){

        console.error("Invoice data error:",error);

        return [];

    }

}


/* =========================================
   LOAD INVOICES
========================================= */

function loadInvoices(){

    const invoices = getInvoices();

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const filtered = invoices.filter(function(invoice){

        const invoiceNo =
            String(invoice.invoiceNo || "").toLowerCase();

        const customer =
            String(invoice.customerName || "").toLowerCase();

        const phone =
            String(invoice.phone || "").toLowerCase();

        const vehicle =
            String(invoice.vehicle || "").toLowerCase();

        const model =
            String(invoice.vehicleModel || "").toLowerCase();


        return (

            invoiceNo.includes(search) ||
            customer.includes(search) ||
            phone.includes(search) ||
            vehicle.includes(search) ||
            model.includes(search)

        );

    });


    renderInvoices(filtered);

    updateSummary(invoices);

}


/* =========================================
   RENDER TABLE
========================================= */

function renderInvoices(invoices){

    const tbody =
        document.getElementById("invoiceTableBody");

    const empty =
        document.getElementById("emptyMessage");


    tbody.innerHTML = "";


    if(invoices.length === 0){

        empty.style.display = "block";

        return;

    }


    empty.style.display = "none";


    /* newest first */

    invoices.slice().reverse().forEach(function(invoice){

        const tr =
            document.createElement("tr");


        const invoiceNo =
            invoice.invoiceNo || "-";

        const date =
            invoice.date || "-";

        const customer =
            invoice.customerName || "-";

        const phone =
            invoice.phone || "-";

        const vehicle =
            invoice.vehicle || "-";

        const payment =
            invoice.payment || "-";


        const vat =
            Number(invoice.vat || 0);


        const grandTotal =
            Number(
                invoice.grandTotal ||
                invoice.total ||
                0
            );


        tr.innerHTML = `

            <td>
                <strong>${escapeHTML(invoiceNo)}</strong>
            </td>

            <td>
                ${escapeHTML(date)}
            </td>

            <td>
                ${escapeHTML(customer)}
            </td>

            <td>
                ${escapeHTML(phone)}
            </td>

            <td>
                ${escapeHTML(vehicle)}
            </td>

            <td>
                <span class="payment">
                    ${escapeHTML(payment)}
                </span>
            </td>

            <td>
                AED ${vat.toFixed(2)}
            </td>

            <td>
                <strong>
                    AED ${grandTotal.toFixed(2)}
                </strong>
            </td>

            <td>

                <button
                    class="actionBtn viewBtn"
                    onclick="viewInvoice('${escapeAttribute(invoiceNo)}')"
                >
                    VIEW
                </button>

                <button
                    class="actionBtn printBtn"
                    onclick="printInvoice('${escapeAttribute(invoiceNo)}')"
                >
                    PRINT
                </button>

                <button
                    class="actionBtn deleteBtn"
                    onclick="deleteInvoice('${escapeAttribute(invoiceNo)}')"
                >
                    DELETE
                </button>

            </td>

        `;


        tbody.appendChild(tr);

    });

}


/* =========================================
   SUMMARY
========================================= */

function updateSummary(invoices){

    const totalInvoices =
        invoices.length;


    let totalSales = 0;

    let totalVat = 0;


    invoices.forEach(function(invoice){

        totalSales += Number(
            invoice.grandTotal ||
            invoice.total ||
            0
        );


        totalVat += Number(
            invoice.vat ||
            0
        );

    });


    const average =
        totalInvoices > 0
        ? totalSales / totalInvoices
        : 0;


    document.getElementById("totalInvoices")
        .textContent = totalInvoices;


    document.getElementById("totalSales")
        .textContent =
        "AED " + totalSales.toFixed(2);


    document.getElementById("totalVat")
        .textContent =
        "AED " + totalVat.toFixed(2);


    document.getElementById("averageInvoice")
        .textContent =
        "AED " + average.toFixed(2);

}


/* =========================================
   VIEW INVOICE
========================================= */

function viewInvoice(invoiceNo){

    const invoices =
        getInvoices();


    const invoice =
        invoices.find(function(item){

            return String(item.invoiceNo) ===
                   String(invoiceNo);

        });


    if(!invoice){

        alert("Invoice not found.");

        return;

    }


    /*
       Save selected invoice
       for the next invoice-view page
    */

    localStorage.setItem(
        "yallaSelectedInvoice",
        JSON.stringify(invoice)
    );


    /*
       For now open the invoice page.
       Later we will connect a dedicated
       view-invoice.html page.
    */

    window.location.href = "invoice.html";

}


/* =========================================
   PRINT INVOICE
========================================= */

function printInvoice(invoiceNo){

    const invoices =
        getInvoices();


    const invoice =
        invoices.find(function(item){

            return String(item.invoiceNo) ===
                   String(invoiceNo);

        });


    if(!invoice){

        alert("Invoice not found.");

        return;

    }


    localStorage.setItem(
        "yallaSelectedInvoice",
        JSON.stringify(invoice)
    );


    window.location.href = "invoice.html";

}


/* =========================================
   DELETE INVOICE
========================================= */

function deleteInvoice(invoiceNo){

    const confirmDelete =
        confirm(
            "Are you sure you want to delete invoice " +
            invoiceNo +
            "?"
        );


    if(!confirmDelete){
        return;
    }


    let invoices =
        getInvoices();


    invoices =
        invoices.filter(function(invoice){

            return String(invoice.invoiceNo) !==
                   String(invoiceNo);

        });


    localStorage.setItem(
        "yallaInvoices",
        JSON.stringify(invoices)
    );


    loadInvoices();

}


/* =========================================
   BACK TO CRM
========================================= */

function goBack(){

    window.location.href = "index.html";

}


/* =========================================
   SECURITY / HTML ESCAPE
========================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


/* =========================================
   START
========================================= */

loadInvoices();

</script>

</body>
</html>
